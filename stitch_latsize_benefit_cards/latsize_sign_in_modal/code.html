<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Latsize Sign In Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=Poppins:wght@600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#0B2447",
              "accent": "#00C2A8",
              "secondary": "#5563FF",
              "background-light": "#f6f7f8",
              "background-dark": "#121820",
              "warm-slate": "#6B7280",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"],
              "heading": ["Poppins", "sans-serif"]
            },
            borderRadius: {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
      }
    </style>
</head>
<body class="font-display">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center bg-background-light dark:bg-background-dark p-4 group/design-root" style='font-family: Inter, "Noto Sans", sans-serif;'>
<div class="absolute inset-0 bg-[url('data:image/svg+xml,%3Csvg%20width%3D%22100%22%20height%3D%22100%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Cdefs%3E%3Cpattern%20id%3D%22a%22%20width%3D%2216%22%20height%3D%2216%22%20patternUnits%3D%22userSpaceOnUse%22%3E%3Ccircle%20cx%3D%221%22%20cy%3D%221%22%20r%3D%221%22%20fill%3D%22%230B2447%22%20fill-opacity%3D%220.1%22/%3E%3C/pattern%3E%3C/defs%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22url(%23a)%22/%3E%3C/svg%3E')] opacity-30 dark:opacity-10"></div>
<div class="relative w-full max-w-md bg-white dark:bg-gray-900 rounded-xl shadow-2xl overflow-hidden">
<button aria-label="Close modal" class="absolute top-4 right-4 text-warm-slate hover:text-primary dark:hover:text-white transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<div class="px-8 py-10 sm:px-12 sm:py-12">
<div class="flex flex-col items-center gap-6">
<h1 class="text-primary dark:text-white text-[32px] font-bold leading-tight text-center font-heading" style="font-family: 'Poppins', sans-serif;">Sign In to Latsize</h1>
<div class="flex w-full flex-col items-stretch gap-4">
<label class="flex flex-col flex-1">
<p class="text-warm-slate dark:text-gray-300 text-sm font-medium leading-normal pb-2">Email</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-primary dark:text-white focus:outline-0 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-accent focus:ring-2 focus:ring-accent/30 h-12 placeholder:text-warm-slate/70 px-4 text-base font-normal leading-normal" placeholder="you@company.com" value=""/>
</label>
<label class="flex flex-col flex-1">
<p class="text-warm-slate dark:text-gray-300 text-sm font-medium leading-normal pb-2">Password</p>
<div class="flex w-full flex-1 items-stretch">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-lg text-primary dark:text-white focus:outline-0 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-accent focus:ring-2 focus:ring-accent/30 h-12 placeholder:text-warm-slate/70 px-4 rounded-r-none border-r-0 text-base font-normal leading-normal" placeholder="Enter your password" type="password" value=""/>
<button aria-label="Toggle password visibility" class="text-warm-slate flex border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 items-center justify-center px-3 rounded-r-lg border-l-0 hover:bg-gray-50 dark:hover:bg-gray-700">
<span class="material-symbols-outlined text-xl">visibility_off</span>
</button>
</div>
</label>
</div>
<div class="w-full">
<a class="text-secondary dark:text-secondary/90 text-sm font-medium leading-normal hover:underline" href="#">Forgot password?</a>
</div>
<button class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-gray-900 transition-all">
<span class="truncate">Sign In</span>
</button>
<p class="text-warm-slate dark:text-gray-400 text-sm font-normal leading-normal text-center">Don't have an account? <a class="font-bold text-secondary dark:text-secondary/90 hover:underline" href="#">Create one</a></p>
</div>
</div>
</div>
</div>
</body></html>
