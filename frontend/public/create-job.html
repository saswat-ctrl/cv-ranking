<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create New Job Pop-up V2</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#19c29d",
                        "primary-dark": "#14a081",
                        "background-light": "#f6f8f8",
                        "background-dark": "#11211d",
                        "soft-mint": "#E9FBEF",
                        "soft-mint-dark": "rgba(25, 194, 157, 0.1)",
                        "gray-900": "#1F2937",
                        "gray-600": "#4B5563",
                        "gray-500": "#6B7280",
                        "gray-400": "#9CA3AF",
                        "slate-200": "#E2E8F0"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "sans": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #e5e7eb;
            border-radius: 20px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #4b5563;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #d1d5db;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #374151;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center p-4 sm:p-8">
<div class="w-full max-w-[800px] bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-slate-200 dark:border-gray-700 overflow-hidden flex flex-col h-auto max-h-[90vh]">
<div class="px-8 py-6 border-b border-gray-100 dark:border-gray-700 flex items-center justify-between shrink-0 bg-white dark:bg-gray-800 z-10">
<h2 class="text-gray-900 dark:text-white text-3xl font-bold leading-tight tracking-tight">
                Create New Job
            </h2>
<button class="text-gray-400 hover:text-gray-600 dark:text-gray-500 dark:hover:text-gray-300 transition-colors p-1 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700">
<span class="material-symbols-outlined text-[24px] block">close</span>
</button>
</div>
<div class="px-8 py-8 flex flex-col gap-8 flex-1 overflow-y-auto custom-scrollbar">
<div class="flex flex-col gap-2">
<label class="text-gray-900 dark:text-white text-sm font-medium" for="job-title">
                    Job Title <span class="text-red-500">*</span>
</label>
<input class="w-full px-4 py-3 bg-white dark:bg-gray-700/50 border border-gray-200 dark:border-gray-600 rounded-lg text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-base font-normal shadow-sm" id="job-title" placeholder="e.g. Senior Product Manager" type="text"/>
<p class="text-gray-600 dark:text-gray-400 text-xs font-normal">
                    A clear and concise title will attract more qualified candidates.
                </p>
</div>
<div class="flex flex-col gap-2 flex-1 min-h-[300px]">
<label class="text-gray-900 dark:text-white text-sm font-medium" for="job-description">
                    Job Description <span class="text-red-500">*</span>
</label>
<div class="flex flex-col border border-gray-200 dark:border-gray-600 rounded-lg overflow-hidden bg-white dark:bg-gray-700/50 focus-within:ring-2 focus-within:ring-primary/20 focus-within:border-primary transition-all flex-1 shadow-sm">
<div class="flex items-center gap-1 p-2 border-b border-gray-200 dark:border-gray-600 bg-gray-50/50 dark:bg-gray-800">
<button class="p-2 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-gray-700 rounded transition-colors" title="Bold">
<span class="material-symbols-outlined text-[20px] block">format_bold</span>
</button>
<button class="p-2 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-gray-700 rounded transition-colors" title="Italic">
<span class="material-symbols-outlined text-[20px] block">format_italic</span>
</button>
<button class="p-2 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-gray-700 rounded transition-colors" title="Underline">
<span class="material-symbols-outlined text-[20px] block">format_underlined</span>
</button>
<div class="w-px h-5 bg-gray-300 dark:bg-gray-600 mx-1"></div>
<button class="p-2 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-gray-700 rounded transition-colors" title="Bullet List">
<span class="material-symbols-outlined text-[20px] block">format_list_bulleted</span>
</button>
<button class="p-2 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-gray-700 rounded transition-colors" title="Numbered List">
<span class="material-symbols-outlined text-[20px] block">format_list_numbered</span>
</button>
<div class="w-px h-5 bg-gray-300 dark:bg-gray-600 mx-1"></div>
<button class="p-2 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-gray-700 rounded transition-colors" title="Link">
<span class="material-symbols-outlined text-[20px] block">link</span>
</button>
</div>
<textarea class="w-full flex-1 p-4 bg-transparent border-none resize-none text-gray-900 dark:text-white placeholder-gray-400 focus:ring-0 text-base font-normal leading-relaxed custom-scrollbar" id="job-description" placeholder="Paste the full job description here..."></textarea>
</div>
</div>
</div>
<div class="px-8 py-6 border-t border-gray-100 dark:border-gray-700 flex items-center justify-between bg-white dark:bg-gray-800 shrink-0 mt-auto">
<button class="text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 text-sm font-medium px-6 py-3 border border-gray-200 dark:border-gray-600 rounded-lg transition-colors">
                Cancel
            </button>
<button class="flex items-center gap-2 bg-primary hover:bg-primary-dark text-white text-sm font-bold px-6 py-3 rounded-lg shadow-lg shadow-primary/20 transition-all hover:translate-y-[-1px] active:translate-y-0">
                Next: Upload CVs
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>

</body></html>
