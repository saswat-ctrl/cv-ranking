[tool.poetry]
name = "cv-ranking-backend"
package-mode = false
version = "0.1.0"
description = "Backend for CV Ranking MVP"
authors = ["Admin <admin@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
sqlalchemy = "^2.0.0"
asyncpg = "^0.29.0"
alembic = "^1.12.0"
pydantic = "^2.4.0"
pydantic-settings = "^2.0.0"
email-validator = "^2.1.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "4.0.1"
python-multipart = "^0.0.6"

# Phase 1: Open-source OCR & Text Extraction
pymupdf = "^1.23.0"
python-docx = "^1.1.0"

pytesseract = "^0.3.10"
pillow = "^10.0.0"

# Phase 1: Resume Parsing
spacy = "^3.7.0"

# Phase 2: Embeddings & Similarity (installing now for future)
sentence-transformers = "^2.3.0"
scikit-learn = "^1.4.0"

# Phase 1: Task Queue
rq = "^1.15.0"
redis = "^5.0.0"

# Utilities
numpy = "^1.26.0"
httpx = "^0.26.0"
boto3 = "^1.34.0"
structlog = "^24.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.4"
black = "^24.1.1"
isort = "^5.13.2"
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
